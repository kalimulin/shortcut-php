# Пример конфигурации для чистого Nginx + PHP-FPM (один домен: SPA + /api/* + /s/{code})
server {
    listen 80;
    server_name example.com;

    root /var/www/example.com/public_html;
    index index.html;

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }

    # Запрет доступа к backend/, если он лежит внутри docroot
    location ^~ /backend/ {
        deny all;
    }

    # 1. Короткие редиректы -> redirect.php
    location ~ ^/s/([0-9A-Za-z_-]{1,64})/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/redirect.php;
        fastcgi_param QUERY_STRING code=$1&$args;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ^~ /s/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/redirect.php;
        fastcgi_param QUERY_STRING code=;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # 2. Весь API -> api.php
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # 3. Статика и SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
